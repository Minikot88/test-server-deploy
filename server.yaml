# Reference for a NEW project only. Replace EVERY CHANGE_ME before applying.
# Runtime Secret must already exist in the namespace; this file contains no values.
apiVersion: v1
kind: Namespace
metadata:
  name: CHANGE_ME_NAMESPACE
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: CHANGE_ME_API_DEPLOYMENT
  namespace: CHANGE_ME_NAMESPACE
spec:
  replicas: 1
  selector:
    matchLabels:
      app: CHANGE_ME_API_DEPLOYMENT
  template:
    metadata:
      labels:
        app: CHANGE_ME_API_DEPLOYMENT
    spec:
      containers:
        - name: api
          image: CHANGE_ME_API_IMAGE_REF
          ports:
            - containerPort: 18787
          envFrom:
            - secretRef:
                name: CHANGE_ME_API_RUNTIME_SECRET
          readinessProbe:
            httpGet:
              path: /health
              port: 18787
---
apiVersion: v1
kind: Service
metadata:
  name: CHANGE_ME_API_DEPLOYMENT
  namespace: CHANGE_ME_NAMESPACE
spec:
  selector:
    app: CHANGE_ME_API_DEPLOYMENT
  ports:
    - port: 18787
      targetPort: 18787
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: CHANGE_ME_WEB_DEPLOYMENT
  namespace: CHANGE_ME_NAMESPACE
spec:
  replicas: 1
  selector:
    matchLabels:
      app: CHANGE_ME_WEB_DEPLOYMENT
  template:
    metadata:
      labels:
        app: CHANGE_ME_WEB_DEPLOYMENT
    spec:
      containers:
        - name: web
          image: CHANGE_ME_WEB_IMAGE_REF
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: CHANGE_ME_WEB_DEPLOYMENT
  namespace: CHANGE_ME_NAMESPACE
spec:
  selector:
    app: CHANGE_ME_WEB_DEPLOYMENT
  ports:
    - port: 80
      targetPort: 8080
